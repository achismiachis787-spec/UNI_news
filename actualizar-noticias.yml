name: Actualizar noticias

on:
  schedule:
    # Se ejecuta todos los días a las 08:00 UTC.
    # Ajusta la hora a tu gusto (recuerda: está en UTC, no en tu hora local).
    - cron: '0 8 * * *'
  workflow_dispatch: {}  # permite ejecutarlo manualmente desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar noticias
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NEWS_LANG: es
        run: python scripts/generar_noticias.py

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualizar noticias $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
